services:
  tuiameaburre:
    build: .
    container_name: tuiameaburre
    restart: unless-stopped
    environment:
      PORT: "5050"
      NODE_ENV: "production"
      DB_PATH: "/app/data/tuia.db"
      # Bots (opcional): sin ANTHROPIC_API_KEY responden con plantillas (gratis).
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      BOTS_ENABLED: "${BOTS_ENABLED:-true}"
      BOT_LLM_ENABLED: "${BOT_LLM_ENABLED:-true}"
      BOT_BUDGET_USD: "${BOT_BUDGET_USD:-20}"
    volumes:
      - tuia-data:/app/data
    networks:
      tuia-net:
        aliases:
          - tuiameaburre

  tuiameaburre-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tuiameaburre-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - tuiameaburre
    networks:
      - tuia-net
    restart: unless-stopped

networks:
  tuia-net:
    name: tuia-net
    driver: bridge

volumes:
  tuia-data:
    name: tuia-data
