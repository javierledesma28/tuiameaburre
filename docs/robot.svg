<svg width="520" height="560" viewBox="0 0 520 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A.R.I.A. — el robot con cabeza de monitor de Tu IA me aburre">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17201a"/>
      <stop offset="100%" stop-color="#0c120e"/>
    </linearGradient>
    <radialGradient id="lamp" cx="82%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mh-screen-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8ff0b5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8ff0b5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mh-scan" x="0" y="0" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="rgba(0,0,0,0.38)"/>
    </pattern>
    <pattern id="room-scan" x="0" y="0" width="3" height="4" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="rgba(255,255,255,0.02)"/>
    </pattern>
    <filter id="mh-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mh-led" x="-80%" y="-80%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Card: el cuarto de madrugada -->
  <rect x="1" y="1" width="518" height="558" rx="22" fill="url(#bg)" stroke="#2c3a2f" stroke-width="2"/>
  <rect x="1" y="1" width="518" height="558" rx="22" fill="url(#lamp)"/>
  <rect x="1" y="1" width="518" height="558" rx="22" fill="url(#room-scan)"/>

  <!-- Ventana de noche (arriba a la izquierda) -->
  <g opacity="0.8">
    <rect x="40" y="44" width="120" height="120" rx="4" fill="#0e1826" stroke="#33413a" stroke-width="2"/>
    <line x1="100" y1="44" x2="100" y2="164" stroke="#33413a" stroke-width="2"/>
    <line x1="40" y1="104" x2="160" y2="104" stroke="#33413a" stroke-width="2"/>
    <circle cx="132" cy="72" r="11" fill="#e9dfae" opacity="0.85"/>
    <circle cx="70" cy="80" r="1.4" fill="#cfe8ff"/><circle cx="118" cy="132" r="1.4" fill="#cfe8ff"/>
    <circle cx="80" cy="140" r="1.1" fill="#cfe8ff"/><circle cx="150" cy="120" r="1.1" fill="#cfe8ff"/>
  </g>

  <!-- Guirnalda de lucecitas -->
  <g>
    <path d="M170 40 Q 260 78 350 40 T 500 46" fill="none" stroke="#3a463c" stroke-width="1.5"/>
    <circle cx="210" cy="60" r="4" fill="#ffb454" filter="url(#mh-led)"/>
    <circle cx="285" cy="66" r="4" fill="#8ff0b5" filter="url(#mh-led)"/>
    <circle cx="350" cy="48" r="4" fill="#ff6f61" filter="url(#mh-led)"/>
    <circle cx="420" cy="60" r="4" fill="#5b8def" filter="url(#mh-led)"/>
  </g>

  <!-- Sombra bajo el robot -->
  <ellipse cx="260" cy="500" rx="120" ry="16" fill="#000" opacity="0.35" filter="url(#soft)"/>

  <!-- ══ ROBOT (MonitorHead) escalado ══ -->
  <g transform="translate(140,70) scale(2)">
    <!-- Antenna -->
    <line x1="60" y1="18" x2="60" y2="44" stroke="#5fbf7d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="14" r="5" fill="#ffb454" filter="url(#mh-led)"/>
    <circle cx="60" cy="14" r="3" fill="#fff" opacity="0.55"/>

    <!-- Monitor shell -->
    <rect x="12" y="44" width="96" height="74" rx="10" fill="#0c1a10" stroke="#5fbf7d" stroke-width="2.5"/>
    <circle cx="20" cy="52" r="2" fill="#2a4a2a" stroke="#5fbf7d" stroke-width="1"/>
    <circle cx="100" cy="52" r="2" fill="#2a4a2a" stroke="#5fbf7d" stroke-width="1"/>
    <circle cx="20" cy="110" r="2" fill="#2a4a2a" stroke="#5fbf7d" stroke-width="1"/>
    <circle cx="100" cy="110" r="2" fill="#2a4a2a" stroke="#5fbf7d" stroke-width="1"/>

    <!-- Screen -->
    <rect x="22" y="52" width="76" height="58" rx="5" fill="#071007"/>
    <rect x="22" y="52" width="76" height="58" rx="5" fill="url(#mh-screen-glow)"/>
    <rect x="22" y="52" width="76" height="58" rx="5" fill="url(#mh-scan)" opacity="0.55"/>
    <ellipse cx="60" cy="58" rx="28" ry="6" fill="rgba(143,240,181,0.04)"/>

    <!-- Eyes -->
    <g filter="url(#mh-glow)">
      <ellipse cx="44" cy="76" rx="10" ry="10" fill="#061206" stroke="#8ff0b5" stroke-width="1" opacity="0.6"/>
      <ellipse cx="44" cy="76" rx="6.5" ry="6.5" fill="#8ff0b5" opacity="0.92"/>
      <ellipse cx="44" cy="76" rx="3.2" ry="3.2" fill="#071007"/>
      <circle cx="43.2" cy="74.8" r="1" fill="rgba(255,255,255,0.45)"/>

      <ellipse cx="76" cy="76" rx="10" ry="10" fill="#061206" stroke="#8ff0b5" stroke-width="1" opacity="0.6"/>
      <ellipse cx="76" cy="76" rx="6.5" ry="6.5" fill="#8ff0b5" opacity="0.92"/>
      <ellipse cx="76" cy="76" rx="3.2" ry="3.2" fill="#071007"/>
      <circle cx="75.2" cy="74.8" r="1" fill="rgba(255,255,255,0.45)"/>
    </g>
    <!-- Smile -->
    <path d="M 46 95 Q 60 104 74 95" fill="none" stroke="#8ff0b5" stroke-width="2.5" stroke-linecap="round" filter="url(#mh-glow)"/>

    <!-- Power LED + brand -->
    <circle cx="84" cy="108" r="3.5" fill="#5fbf7d" filter="url(#mh-led)"/>
    <text x="23" y="108" fill="#8ff0b5" font-size="5.5" font-family="monospace" opacity="0.55">TUI</text>

    <!-- Base/stand -->
    <rect x="46" y="118" width="28" height="6" rx="3" fill="#142014" stroke="#5fbf7d" stroke-width="1.5"/>
    <rect x="36" y="123" width="48" height="4" rx="2" fill="#142014" stroke="#5fbf7d" stroke-width="1.5" opacity="0.7"/>
    <!-- Neck -->
    <rect x="49" y="127" width="22" height="12" rx="3" fill="#0c1a10" stroke="#5fbf7d" stroke-width="1.5"/>
    <!-- Torso -->
    <rect x="30" y="139" width="60" height="44" rx="7" fill="#0c1a10" stroke="#5fbf7d" stroke-width="2.2"/>
    <rect x="40" y="147" width="40" height="26" rx="4" fill="#071007" stroke="#5fbf7d" stroke-width="1" opacity="0.9"/>
    <rect x="44" y="152" width="10" height="4" rx="2" fill="#8ff0b5" opacity="0.5"/>
    <rect x="44" y="159" width="6" height="4" rx="2" fill="#ffb454" opacity="0.55"/>
    <rect x="52" y="159" width="6" height="4" rx="2" fill="#ff6f61" opacity="0.45"/>
    <text x="68" y="163" fill="#8ff0b5" font-size="6" font-family="monospace" opacity="0.7">AI?</text>
    <!-- Arms -->
    <line x1="30" y1="152" x2="10" y2="172" stroke="#5fbf7d" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="8" cy="175" r="5.5" fill="#0c1a10" stroke="#5fbf7d" stroke-width="2"/>
    <line x1="90" y1="152" x2="110" y2="172" stroke="#5fbf7d" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="112" cy="175" r="5.5" fill="#0c1a10" stroke="#5fbf7d" stroke-width="2"/>
    <!-- Legs -->
    <line x1="50" y1="183" x2="46" y2="206" stroke="#5fbf7d" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="70" y1="183" x2="74" y2="206" stroke="#5fbf7d" stroke-width="5.5" stroke-linecap="round"/>
    <rect x="37" y="203" width="18" height="7" rx="3.5" fill="#0c1a10" stroke="#5fbf7d" stroke-width="2"/>
    <rect x="65" y="203" width="18" height="7" rx="3.5" fill="#0c1a10" stroke="#5fbf7d" stroke-width="2"/>
  </g>

  <!-- Bocadillo: la IA con menos ganas del mundo -->
  <g transform="translate(348,196)">
    <rect x="0" y="0" width="150" height="60" rx="10" fill="#f4ecd8" transform="rotate(3)"/>
    <text x="16" y="26" font-family="'Comic Sans MS','Segoe UI',sans-serif" font-size="13" fill="#2a2415" transform="rotate(3)">"como IA que soy,</text>
    <text x="16" y="45" font-family="'Comic Sans MS','Segoe UI',sans-serif" font-size="13" fill="#2a2415" transform="rotate(3)">no te puedo ayudar"</text>
  </g>

  <!-- Título -->
  <text x="260" y="534" text-anchor="middle" font-family="'Permanent Marker','Comic Sans MS',cursive" font-size="30" fill="#f0e9d6">Tu IA me aburre</text>
</svg>
