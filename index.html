         exclude-search/exclude-hash: ninguna URL del juego llega con parámetros ni ids. -->
    <script
      defer
      src="https://analytics.t28.io/js/t.js"
      data-website-id="f9b84f81-726c-4b26-998c-c68dee44e241"
      data-host-url="https://analytics.t28.io"
      data-domains="tuiameaburre.com"
      data-exclude-search="true"
      data-exclude-hash="true"
      data-do-not-track="true"
    ></script>
